name: 特色站第三批・站房與月台
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/station-next.yml'
      - 'prototypes/tiny-trains/blender/building-batch/core.py'
      - 'prototypes/tiny-trains/blender/tainan-memory-v1/geo.py'
permissions:
  contents: read
concurrency:
  group: station-next-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  models:
    if: github.head_ref == 'codex/taipei-station-blender-preview' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TASK_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
