        import bpy,json,math,sys
        from pathlib import Path
        from mathutils import Vector
        HERE=Path(__file__).resolve().parent
        sys.path.insert(0,str(HERE.parent/"building-batch"))
        import core as c
        sys.path.insert(0,str(HERE.parent/"tainan-memory-v1"))
        import geo as g
        SPECS=json.loads((HERE/"stations.json").read_text())
        OUT=Path(sys.argv[sys.argv.index("--")+1])
        
        def from_geo(name,G,component,detail=False):
            for (mat,lod),buf in G.buf.items():
                verts=[buf[i:i+3] for i in range(0,len(buf),6)]
                norms=[buf[i+3:i+6] for i in range(0,len(buf),6)]
                o=c.mesh(name+" "+mat,verts,[(i,i+1,i+2) for i in range(0,len(verts),3)],mat,component=component,detail=detail or lod=="near")
                o.data.polygons.foreach_set("use_smooth",[True]*len(o.data.polygons))
                o.data.normals_split_custom_set_from_vertices(norms)
                if hasattr(o.data,"use_auto_smooth"):o.data.use_auto_smooth=True
        def text_label(body,x,y,z,size=.55):
            font=Path("/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc")
            if not font.exists():return
            data=bpy.data.curves.new(body,"FONT");data.body=body;data.size=size;data.align_x="CENTER";data.align_y="CENTER";data.resolution_u=3;data.extrude=.008
            data.font=bpy.data.fonts.load(str(font));data.materials.append(c.M["trim"])
            o=bpy.data.objects.new(body,data);c.ASSET.objects.link(o)
            o.location=(x,y,z);o.rotation_euler=(math.pi/2,0,0)
            bpy.ops.object.select_all(action="DESELECT");o.select_set(True);bpy.context.view_layer.objects.active=o
            bpy.ops.object.convert(target="MESH");o=bpy.context.object;o["component_id"]="illustrative-signage";o["near_only"]=True;c.OBJECTS.append(o);o.select_set(False)
        def facade(name,y,x0,x1,h,holes,base=.30,cladding=False):
            G=g.Geo();f=g.front(y);g.wall_f(G,f,x0,x1,base,h,holes,"wall","wood");from_geo(name,G,"walls")
            for i,hole in enumerate(holes):
                GG=g.Geo();g.fill_poly_f(GG,f,hole["poly"],-hole["depth"]+.03,"glass");from_geo(name+" opening "+str(i),GG,"openings")
                poly=hole["poly"];cx=(min(u for u,v in poly)+max(u for u,v in poly))/2;cz=(min(v for u,v in poly)+max(v for u,v in poly))/2
                outer=[(cx+(u-cx)*1.10,max(base,cz+(v-cz)*1.06)) for u,v in poly]
                GG=g.Geo();g.band_f(GG,f,outer,poly,0,.10,"wood",closed=True,skip="n");from_geo(name+" frame "+str(i),GG,"window-frames",True)
            if cladding:
                # Horizontal wooden divisions terminate at openings.
                for i in range(1,int((h-base)/.35)):
                    z=base+i*.35;cuts=[]
                    for hole in holes:
                        poly=hole["poly"]
                        if min(v for u,v in poly)<=z<=max(v for u,v in poly):cuts.append((min(u for u,v in poly)-.01,max(u for u,v in poly)+.01))
                    at=x0
                    for a,b in sorted(cuts):
                        if a>at:c.box("Board seam",((at+a)/2,y-.045,z),(a-at,.04,.028),"wood",component="cladding-seams",detail=True)
                        at=max(at,b)
                    if at<x1:c.box("Board seam",((at+x1)/2,y-.045,z),(x1-at,.04,.028),"wood",component="cladding-seams",detail=True)
        def house(name,x0,x1,y0,y1,h,holes,cladding=False):
            c.box(name+" foundation",((x0+x1)/2,(y0+y1)/2,.15),(x1-x0,y1-y0,.30),"stone",component="foundation")
            facade(name+" front",y0,x0,x1,h,holes,cladding=cladding)
            G=g.Geo()
            g.wall_f(G,g.back(y1),-x1,-x0,.30,h,[],"wall")
            g.wall_f(G,g.left(x0),-y1,-y0,.30,h,[],"wall")
            g.wall_f(G,g.right(x1),y0,y1,.30,h,[],"wall")
            from_geo(name+" side and rear",G,"walls")
            c.box(name+" ceiling",((x0+x1)/2,(y0+y1)/2,h-.06),(x1-x0,y1-y0,.12),"dark",component="ceiling")
        def perimeter(name,x0,x1,y0,y1,z,mat="wood"):
            for y in (y0,y1):c.box(name,((x0+x1)/2,y,z),(x1-x0,.17,.16),mat,component="eave-frames")
            for x in (x0,x1):c.box(name,(x,(y0+y1)/2,z),(.17,y1-y0,.16),mat,component="eave-frames")
        def simple_hip(name,cx,cy,w,d,z,peak):
            v=[(cx-w/2,cy-d/2,z),(cx+w/2,cy-d/2,z),(cx+w/2,cy+d/2,z),(cx-w/2,cy+d/2,z),
               (cx-w*.28,cy,peak),(cx+w*.28,cy,peak)]
            c.mesh(name,v,[(0,1,5,4),(1,2,5),(2,3,4,5),(3,0,4),(3,2,1,0)],"roof",component="roof")
        
        def timber_roof(p):
            w,d=p["mainWidth"],p["mainDepth"];cx=p["porchCenterX"];pw=p["porchWidth"];proj=p["porchProjection"]
            ax0,ax1=-w/2-.7,w/2+.7;ay0,ay1=-d/2-.65,d/2+.65
            bx0,bx1=cx-pw/2-.55,cx+pw/2+.55;by0=-d/2-proj-.55;by1=0
            xs=sorted(set([round(ax0+(ax1-ax0)*i/max(1,math.ceil((ax1-ax0)/1.8)),7) for i in range(math.ceil((ax1-ax0)/1.8)+1)]+[bx0,bx1,cx,ax0,ax1]))
            ys=sorted(set([round(by0+(ay1-by0)*i/max(1,math.ceil((ay1-by0)/1.5)),7) for i in range(math.ceil((ay1-by0)/1.5)+1)]+[ay0,ay1,by0,by1,0]))
            def inside(x,y):
                return ax0-1e-7<=x<=ax1+1e-7 and ay0-1e-7<=y<=ay1+1e-7 or bx0-1e-7<=x<=bx1+1e-7 and by0-1e-7<=y<=by1+1e-7
            def height(x,y):
                vals=[]
                if ax0-1e-7<=x<=ax1+1e-7 and ay0-1e-7<=y<=ay1+1e-7:vals.append(p["eave"]+p["rise"]*(1-abs(y)/(d/2+.65)))
                if bx0-1e-7<=x<=bx1+1e-7 and by0-1e-7<=y<=by1+1e-7:vals.append(p["eave"]-.18+p["porchRise"]*(1-abs(x-cx)/(pw/2+.55)))
                return max(vals)
            verts=[];index={};top=[];edges={}
            def vertex(x,y):
                key=(round(x,6),round(y,6))
                if key not in index:index[key]=len(verts);verts.append((x,y,height(x,y)))
                return index[key]
            for i in range(len(xs)-1):
                for j in range(len(ys)-1):
                    xa,xb=xs[i:i+2];ya,yb=ys[j:j+2]
                    if not inside((xa+xb)/2,(ya+yb)/2):continue
                    q=(vertex(xa,ya),vertex(xb,ya),vertex(xb,yb),vertex(xa,yb));top.append(q)
                    for a,b in zip(q,q[1:]+q[:1]):
                        key=tuple(sorted((a,b)));edges[key]=edges.get(key,0)+1
            n=len(verts);verts+= [(x,y,z-.15) for x,y,z in verts]
            faces=list(top)+[tuple(i+n for i in reversed(q)) for q in top]+[(a,b,b+n,a+n) for (a,b),count in edges.items() if count==1]
            c.mesh("Joined gable roof",verts,faces,"roof",component="joined-gable-roof")
            # Vertical gable panels under the ridge; roof is fully closed independently.
            for x in (-w/2,w/2):
                c.mesh("Timber end gable",[(xx,y,z) for xx in (x-.06,x+.06) for y,z in [(-d/2,p["eave"]),(d/2,p["eave"]),(0,p["eave"]+p["rise"])]],[(2,1,0),(3,4,5),(0,1,4,3),(1,2,5,4),(2,0,3,5)],"wall",component="gable-panels")
                c.beam("Gable fascia",(x,-d/2-.65,p["eave"]+.02),(x,0,p["eave"]+p["rise"]+.02),.12,"wood",component="gable-trim")
                c.beam("Gable fascia",(x,d/2+.65,p["eave"]+.02),(x,0,p["eave"]+p["rise"]+.02),.12,"wood",component="gable-trim")
            # Small raised seams are near-only and follow the combined surface.
            for x in xs[1:-1]:
                for a,b in zip(ys,ys[1:]):
                    if inside(x,(a+b)/2):c.beam("Roof joint",(x,a,height(x,a)+.055),(x,b,height(x,b)+.055),.035,"roof",component="roof-joints",detail=True)
        
        def timber(s):
            p=s["estimatedParameters"];w,d=p["mainWidth"],p["mainDepth"];e=p["eave"];door=p["doorX"]
            holes=[g.hole_rect(door,1.75,.30,2.9,.25)]+[g.hole_rect(x,1.55,1.0,2.65,.25) for x in p["windowXs"]]
            house("Timber station",-w/2,w/2,-d/2,d/2,e,holes,True)
            timber_roof(p)
