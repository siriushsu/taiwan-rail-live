      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            prototypes/tiny-trains/blender/building-batch
            prototypes/tiny-trains/blender/tainan-memory-v1
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender fonts-noto-cjk python3-pil python3-numpy
      - name: Materialize reproducible batch source
        run: |
          python3 - <<'PY'
          import os,ast,json
          from pathlib import Path
          path=Path("prototypes/tiny-trains/blender/station-next")
          path.mkdir(parents=True,exist_ok=True)
          for key,name in [("BATCH_BUILD","build.py"),("BATCH_VERIFY","verify.py"),("BATCH_COMPOSE","compose.py"),("BATCH_SPECS","stations.json")]:
              value=os.environ[key]
              if name.endswith(".py"):ast.parse(value)
              else:json.loads(value)
              (path/name).write_text(value+"\n")
          PY
      - name: Build four station houses and Shifen platform study
        id: build
        run: blender -b -t 2 --python-exit-code 1 --python prototypes/tiny-trains/blender/station-next/build.py -- output/station-next
      - name: Validate structure and map exports
        id: verify
        run: blender -b -t 2 --python-exit-code 1 --python prototypes/tiny-trains/blender/station-next/verify.py -- output/station-next
      - name: Compose actual renders and updated production manifest
        if: always() && steps.build.outcome == 'success'
        run: python3 prototypes/tiny-trains/blender/station-next/compose.py
      - name: Preserve complete source layout
        if: always() && steps.build.outcome == 'success'
        run: |
          mkdir -p output/station-next/source/prototypes/tiny-trains/blender/building-batch output/station-next/source/prototypes/tiny-trains/blender/tainan-memory-v1
          cp -r prototypes/tiny-trains/blender/station-next output/station-next/source/prototypes/tiny-trains/blender/
          cp prototypes/tiny-trains/blender/building-batch/core.py output/station-next/source/prototypes/tiny-trains/blender/building-batch/
          cp prototypes/tiny-trains/blender/tainan-memory-v1/geo.py output/station-next/source/prototypes/tiny-trains/blender/tainan-memory-v1/
          if [ -f LICENSE ]; then cp LICENSE output/station-next/source/; fi
      - name: Save editable Blender models, map assets and review
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: station-next-imperial-jiji-tanwen-dashan-shifen
          path: output/station-next/
          retention-days: 90
          if-no-files-found: error
