# GitHub Pages 用 legacy Jekyll build，
# 直接從 main 分支根目錄建置、push 就自動更新，且沒有 .assetsignore 那層保護。
# app/ 底下有還沒 commit 到 gitignore 的草稿文件（隱私政策、條款、商店文案、
# 原生 bridge 原始碼等），排除它們，避免 push 後被 Jekyll 當一般靜態檔公開發布。
#
# 2026-07-29 稽核補齊：正式站對 worker.js、docs/audits/*、hand off/* 一律回 404（.assetsignore
# 管住了），但備援站照樣回 200——同一份東西，兩個站兩種行為。repo 本來就是 public，所以這不是
# 新的秘密外洩，而是「多一個會被搜尋引擎索引的鏡像」與縱深防禦的破口。
# 這份清單刻意對齊 .assetsignore 的同名條目；兩邊語意域不同（一個管 wrangler 上傳、一個管 Jekyll
# 發布），但「不該公開的東西」應該是同一份。日後在 .assetsignore 加了新的排除，這裡也要加。
# 反向提醒：備援站需要的東西不要誤排——index.html、data/、assets/、各法務頁都必須留著。
#
# ⚠️ 目錄請一律寫尾斜線（app/），不要寫成 app。Jekyll 的 exclude 是「前綴比對」不是「路徑比對」
# （entry_filter.rb 的 glob_include? 走 entry_path.start_with?(item)），所以 `- app` 會連
# app-support.html、apple-touch-180.png 一起排掉——這兩個曾因此在備援站回 404 長達數週。
# 寫成 `app/` 後前綴變 "app/"，只有真正在該目錄底下的檔案會命中。
exclude:
  - app/
  # 2026-08-29:data/tdx 已移出版控 ⇒ 不在 main 裡,Pages 本來就構不到。這條防「哪天有人又 git add 回來」。
  # 移除前實測 siriushsu.github.io/taiwan-rail-live/data/tdx/*.json 抽三檔全 200(單檔最大 5.86MB),
  # 而同一批檔在正式站是靠 .assetsignore 擋的——正是上面說的「兩個站兩種行為」那個破口。
  - data/tdx/
  - worker.js
  - wrangler.jsonc
  - firebase.json
  - firestore.rules
  - schema
  - scripts
  - docs
  - hand off
  - prototypes
  - suno musics
  - node_modules
  - package.json
  - package-lock.json
  - AGENTS.md
  - DESIGN_BRIEF.md
  - TODO.md
  - design-mock.html
  - scratchpad
  # 兌換碼領取頁完全靠 /api/pass-* 運作，而備援站沒有 Worker ⇒ 在那邊只會是一個按了沒反應的
  # 表單。排掉它，免得有人從備援站進來以為壞了。（正式站不受影響：這裡管的是 Jekyll 備援站）
  - pass.html
