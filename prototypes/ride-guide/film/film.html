<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>乘車導覽發布影片</title>
<style>
/* 整支片是 renderAt(t) 的純函數：同一個 t 永遠畫出同一格，逐格算繪不掉格。
   畫風只有一套：軌島明亮主題的琺瑯站名牌——米白紙、藏青、印章紅、警戒金、硬投影、鐵道粗線。 */
:root{
  --paper:#F3EBDA; --paper-hi:#FFFDF6; --navy:#2A4A73; --deep:#1E2C40; --band1:#2c4f86; --band2:#26497e; --band3:#1f3d6b;
  --red:#D23C2A; --red-deep:#A92C1D; --gold:#D2A12A; --gold-hi:#E8B84B; --green:#1B8F4D; --amber:#A3641A; --amber-bg:#FBE9DF; --amber-line:#E0A37E;
  --ink:#3A3226; --muted:#6B5F4A; --line:#C9B98F; --frame:#767061; --plate-ink:#26497E; --train:#2E6FB0;
  --font:"Noto Sans TC","PingFang TC",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:var(--font);color:var(--deep);
  background:
    radial-gradient(1400px 900px at 70% 20%, rgba(255,253,246,.85) 0%, rgba(255,253,246,0) 60%),
    radial-gradient(1200px 800px at 10% 100%, rgba(201,185,143,.25) 0%, rgba(201,185,143,0) 60%),
    var(--paper)}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.22;mix-blend-mode:multiply;z-index:50}
.scene{position:absolute;inset:0;overflow:hidden;perspective:2000px}
.cam{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.a{position:absolute;left:0;top:0;transform-origin:50% 50%;will-change:transform,opacity}
.paperbg{background:radial-gradient(1400px 900px at 70% 20%, rgba(255,253,246,.85) 0%, rgba(255,253,246,0) 60%),radial-gradient(1200px 800px at 10% 100%, rgba(201,185,143,.25) 0%, rgba(201,185,143,0) 60%),var(--paper)}
.navybg{background:linear-gradient(170deg,var(--band1) 0%,var(--band2) 55%,var(--band3) 100%)}

/* 手機：全片同一款深藏青機框 */
.phone{width:432px;height:898px;border-radius:64px;background:var(--deep);padding:16px;box-shadow:0 40px 80px rgba(30,44,64,.30),0 6px 0 #0f1a2b}
.phone .scr{position:relative;width:400px;height:866px;border-radius:48px;overflow:hidden;background:var(--paper-hi)}
.phone .scr img{position:absolute;left:0;top:0;width:400px;height:866px;display:block}
.phone .flash{position:absolute;inset:0;background:#fff;opacity:0}

/* 琺瑯站名牌 */
.plate{display:grid;text-align:center;background:linear-gradient(178deg,#fff 0%,#F7F5EE 72%,#EDEBE0 100%);border:8px solid var(--frame);border-radius:28px;
  box-shadow:0 0 0 3px var(--frame),0 22px 40px rgba(58,50,38,.22);overflow:hidden}
.plate .pn{font-weight:900;color:var(--plate-ink);line-height:1.12}
.plate .ps{font-weight:800;color:var(--plate-ink);opacity:.85;letter-spacing:.3em;text-indent:.3em}
.plate .pf{display:flex;justify-content:space-between;align-items:center;gap:30px;background:linear-gradient(178deg,var(--band1) 0%,var(--band2) 55%,var(--band3) 100%);color:#fff8ec;font-weight:800}

/* Logo（依 favicon／og 的琺瑯牌重建，島形與路網是正式站 logo 的向量） */
.logo{width:600px;height:600px}
.logo .fr{position:absolute;inset:0;border-radius:96px;background:linear-gradient(160deg,#A39E91,#7E796C)}
.logo .pl{position:absolute;inset:22px;border-radius:78px;background:linear-gradient(178deg,#fff 0%,#F8F6EF 70%,#ECE9DF 100%);box-shadow:inset 0 0 0 3px #CFC9BB}
.logo .rv{position:absolute;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#D9D5CB,#9C978A);box-shadow:0 1px 0 #77736A}
.logo svg.isle{position:absolute;left:62px;top:86px;width:476px;height:192px;overflow:visible}
.logo .nm{position:absolute;left:0;right:0;top:288px;display:flex;justify-content:center;gap:72px;font-size:136px;font-weight:900;color:var(--plate-ink);line-height:1}
.logo .nm span{display:inline-block;transform-origin:50% 60%}
.logo .en{position:absolute;left:0;right:0;top:446px;text-align:center;font-size:40px;font-weight:800;color:var(--plate-ink);white-space:nowrap}
.logo .row{position:absolute;left:0;right:0;top:500px;display:flex;justify-content:center;align-items:center;gap:22px;font-size:44px;font-weight:900;color:var(--plate-ink)}
.logo .row i{display:block;width:120px;height:4px;background:var(--plate-ink);position:relative;transform-origin:50% 50%}
.logo .row i::before,.logo .row i::after{content:"";position:absolute;top:-8px;border:10px solid transparent}
.logo .row i::before{left:-14px;border-right:14px solid var(--plate-ink);border-left:0}
.logo .row i::after{right:-14px;border-left:14px solid var(--plate-ink);border-right:0}

/* 文字 */
.h{font-weight:900;line-height:1.1;white-space:nowrap;letter-spacing:.01em}
.h span{display:inline-block;will-change:transform,opacity}
.kick{display:inline-block;font-size:34px;font-weight:900;color:#fff;background:var(--red);border-radius:14px;padding:4px 18px;box-shadow:0 4px 0 var(--red-deep)}
.sub{font-size:40px;font-weight:700;color:var(--muted);white-space:nowrap}
.card{background:var(--paper-hi);border:4px solid var(--line);border-radius:22px;box-shadow:0 8px 0 rgba(30,44,64,.14)}
.chip{display:inline-flex;align-items:center;gap:14px;font-size:40px;font-weight:900;color:var(--deep);background:var(--paper-hi);border:4px solid var(--line);border-radius:999px;padding:10px 30px;box-shadow:0 6px 0 rgba(30,44,64,.14);white-space:nowrap}
.chip b{color:var(--red)}
.ok{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--green);color:#fff;font-size:28px}
.train{width:132px;height:62px;border-radius:16px;background:var(--train);border:5px solid var(--paper-hi);box-shadow:0 6px 0 rgba(30,44,64,.2)}
.train::after{content:"";position:absolute;right:26px;top:16px;border:12px solid transparent;border-left:18px solid #fff;border-right:0}
.rail{height:16px;border-radius:8px;background:var(--navy);transform-origin:0 50%}
.rail::after{content:"";position:absolute;left:0;right:0;top:6px;height:4px;background:repeating-linear-gradient(90deg,rgba(255,253,246,.9) 0 26px,transparent 26px 46px)}
.stampc{width:280px;height:280px;border-radius:50%;border:14px solid var(--red);display:grid;place-items:center;color:var(--red);font-weight:900;text-align:center;line-height:1.05;background:rgba(255,253,246,.7)}
.band{background:linear-gradient(178deg,var(--band1) 0%,var(--band2) 55%,var(--band3) 100%)}
.ring{width:120px;height:120px;border-radius:50%;border:8px solid var(--gold)}
.dchip{width:190px;height:150px;border-radius:24px;background:var(--paper-hi);border:4px solid var(--line);box-shadow:0 8px 0 rgba(30,44,64,.14);display:grid;place-items:center;align-content:center;gap:4px}
.dchip b{font-size:56px;font-weight:900;color:var(--deep);line-height:1;display:flex;align-items:center;gap:8px}
.dchip b i{display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--red)}
.dchip small{font-size:30px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.dchip.on{background:var(--navy);border-color:var(--navy);box-shadow:0 8px 0 var(--deep)}
.dchip.on b,.dchip.on small{color:#FFFDF6}
.dchip.on b i{background:#FFFDF6}
.pin{width:64px;height:64px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:6px solid #fff;box-shadow:0 6px 0 rgba(30,44,64,.18)}
.board{width:560px;border-radius:24px;background:var(--deep);padding:22px 26px;box-shadow:0 14px 30px rgba(30,44,64,.35)}
.board .r{display:grid;grid-template-columns:120px 110px 1fr;gap:16px;align-items:center;color:#FFFDF6;font-size:36px;font-weight:800;padding:10px 0;border-top:2px solid rgba(255,253,246,.15);font-variant-numeric:tabular-nums}
.board .r:first-child{border-top:0}
.board .r em{font-style:normal;font-size:24px;background:var(--train);border-radius:999px;padding:2px 12px;text-align:center}
.seal{width:420px;height:270px;border-radius:30px;display:grid;place-items:center;align-content:center;gap:6px;text-align:center;background:rgba(255,253,246,.92)}
.seal b{font-size:96px;font-weight:900;line-height:1}
.seal small{font-size:34px;font-weight:800}
.wipe{width:1700px;height:1500px;transform-origin:50% 50%}
.wipe::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:10px;margin-left:-5px;background:repeating-linear-gradient(180deg,rgba(255,253,246,.85) 0 40px,transparent 40px 70px)}
.toggle{width:640px;height:170px;border-radius:85px;background:var(--paper-hi);border:6px solid var(--line);box-shadow:0 10px 0 rgba(30,44,64,.14)}
.toggle .kn{position:absolute;left:14px;top:14px;width:300px;height:130px;border-radius:65px;background:var(--navy);box-shadow:0 6px 0 var(--deep)}
.toggle .lb{position:absolute;top:0;width:320px;height:158px;display:grid;place-items:center;font-size:76px;font-weight:900}
.alertc{width:560px;border-radius:26px;border:5px solid var(--amber-line);background:var(--amber-bg);padding:26px 30px;box-shadow:0 8px 0 rgba(30,44,64,.12)}
.alertc b{display:block;font-size:46px;font-weight:900;color:var(--amber)}
.alertc span{font-size:32px;font-weight:700;color:var(--ink)}
</style>
</head>
<body>
<div id="stage">
  <svg id="grain" width="1920" height="1080" aria-hidden="true"><filter id="gr"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .40  0 0 0 0 .32  0 0 0 .55 0"/></filter><rect width="1920" height="1080" filter="url(#gr)"/></svg>
</div>
<script src="logo-isle.js"></script>
<script src="network.js"></script>
<script src="../data/routes.js"></script>
<script>
(function () {
  'use strict';
  const DUR = 58;
  const stage = document.getElementById('stage');

  /* ───────── 時間工具 ───────── */
  const E = {
    lin: (x) => x,
    oc: (x) => 1 - (1 - x) ** 3,
    ic: (x) => x ** 3,
    io: (x) => (x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2),
    oe: (x) => (x >= 1 ? 1 : 1 - 2 ** (-10 * x)),
    ie: (x) => (x <= 0 ? 0 : 2 ** (10 * x - 10)),
    ioe: (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x < 0.5 ? 2 ** (20 * x - 10) / 2 : (2 - 2 ** (-20 * x + 10)) / 2),
    ob: (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * (x - 1) ** 3 + c1 * (x - 1) ** 2; },
    sp: (x) => (x >= 1 ? 1 : 1 - Math.exp(-6.5 * x) * Math.cos(11 * x)),
  };
  const cl = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
  const pr = (t, a, b, e = E.oc) => e(cl((t - a) / (b - a)));
  const mix = (a, b, p) => a + (b - a) * p;
  function kf(t, ks) {
    if (t <= ks[0][0]) return ks[0][1];
    for (let i = 0; i < ks.length - 1; i++) {
      const [t0, v0, e] = ks[i], [t1, v1] = ks[i + 1];
      if (t <= t1) return mix(v0, v1, (e || E.io)((t - t0) / (t1 - t0)));
    }
    return ks[ks.length - 1][1];
  }
  // 撞擊震動：固定公式，同一個 t 震出同一個位移
  function shake(t, hits, amp = 14, dur = 0.16) {
    let x = 0, y = 0;
    for (const h of hits) { const p = (t - h) / dur; if (p >= 0 && p < 1) { const a = amp * (1 - p) ** 2; x += a * Math.sin(t * 173.1); y += a * Math.cos(t * 151.7); } }
    return [x, y];
  }

  /* ───────── DOM 工具 ───────── */
  function el(tag, cls, parent, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; (parent || stage).appendChild(e); return e; }
  function put(e, o) {
    const s = (o.s ?? 1);
    e.style.transform = `translate(${(o.x ?? 0).toFixed(2)}px,${(o.y ?? 0).toFixed(2)}px) translate(-50%,-50%)${o.ry ? ` rotateY(${o.ry.toFixed(2)}deg)` : ''}${o.r ? ` rotate(${o.r.toFixed(2)}deg)` : ''} scale(${(s * (o.sx ?? 1)).toFixed(4)},${(s * (o.sy ?? 1)).toFixed(4)})`;
    e.style.opacity = (o.o ?? 1).toFixed(3);
    e.style.filter = o.blur > 0.3 ? `blur(${o.blur.toFixed(1)}px)` : 'none';
  }
  function cam(c, fx, fy, k, r = 0, cx = 960, cy = 540) {
    c.style.transform = `translate(${cx}px,${cy}px) rotate(${r}deg) scale(${k.toFixed(4)}) translate(${-fx}px,${-fy}px)`;
  }
  function chars(parent, text, cls, style) {
    const h = el('div', 'a h ' + (cls || ''), parent);
    if (style) Object.assign(h.style, style);
    const spans = [];
    for (const part of text) {
      const [txt, color] = Array.isArray(part) ? part : [part, null];
      for (const ch of txt) { const sp = el('span', '', h, ch === ' ' ? '&nbsp;' : ch); if (color) sp.style.color = color; spans.push(sp); }
    }
    return { el: h, spans };
  }
  // 逐字彈入：從下方竄出＋放大回落
  function popChars(k, t, t0, stg = 0.04, dur = 0.34, rise = 70) {
    k.spans.forEach((sp, i) => {
      const p = pr(t, t0 + i * stg, t0 + i * stg + dur, E.ob);
      const o = pr(t, t0 + i * stg, t0 + i * stg + dur * 0.4);
      sp.style.transform = `translateY(${((1 - p) * rise).toFixed(1)}px) scale(${mix(1.5, 1, p).toFixed(3)})`;
      sp.style.opacity = o.toFixed(3);
    });
  }
  function img(src, parent, cls) { const i = el('img', cls || '', parent); i.src = src; i.decoding = 'sync'; return i; }

  function makePhone(parent, srcs) {
    const p = el('div', 'a phone', parent);
    const scr = el('div', 'scr', p);
    const imgs = {};
    srcs.forEach((s) => { imgs[s] = img(`assets/${s}.png`, scr); imgs[s].style.opacity = 0; });
    const flash = el('div', 'flash', scr);
    return { el: p, imgs, flash, view(map) { for (const k in imgs) imgs[k].style.opacity = (map[k] || 0).toFixed(3); } };
  }
  // 手機螢幕上的一點（u,v：0–1）換算成舞台座標
  const phonePt = (px, py, s, u, v) => [px + (u - 0.5) * 400 * s, py + (v - 0.5) * 866 * s];

  function makePlate(parent, { name, sub, left, mid, right, w, nameSize, subSize, footSize, gap }) {
    const p = el('div', 'a plate', parent);
    p.style.width = w + 'px';
    p.innerHTML = `<div class="pn" style="font-size:${nameSize}px;letter-spacing:${gap || 0}px;text-indent:${gap || 0}px;padding-top:${Math.round(nameSize * 0.12)}px">${name}</div>
      <div class="ps" style="font-size:${subSize}px;padding-bottom:${Math.round(subSize * 0.5)}px">${sub}</div>
      <div class="pf" style="font-size:${footSize}px;padding:${Math.round(footSize * 0.35)}px ${Math.round(footSize * 0.8)}px"><span>${left}</span><span style="font-size:.7em;opacity:.85">${mid}</span><span>${right}</span></div>`;
    return p;
  }

  function makeLogo(parent) {
    const root = el('div', 'a logo', parent);
    el('div', 'fr', root);
    el('div', 'pl', root);
    const rv = [[54, 54], [524, 54], [54, 524], [524, 524]].map(([x, y]) => { const r = el('i', 'rv', root); r.style.left = x + 'px'; r.style.top = y + 'px'; return r; });
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'isle'); svg.setAttribute('viewBox', '16.5 18.5 87 35');
    svg.innerHTML = window.ISLE_G;
    root.appendChild(svg);
    const nm = el('div', 'nm', root, '<span>軌</span><span>島</span>');
    const en = el('div', 'en', root, 'RAIL ISLAND');
    const row = el('div', 'row', root, '<span>基隆</span><i></i><span>枋寮</span>');
    const rails = [...svg.querySelectorAll('g[fill="none"] path')];
    const solid = rails.filter((p) => !p.getAttribute('stroke-dasharray'));
    const dashed = rails.filter((p) => p.getAttribute('stroke-dasharray'));
    const lens = solid.map((p) => p.getTotalLength());
    const marks = [...svg.querySelectorAll('rect, circle')];
    const [rl, ra, rr] = [...row.children];
    // p：從 logo 開始算的秒數；k：速度倍率（片尾用較快的版本）
    function render(p, k = 1) {
      const q = p * k;
      put(root, { x: root._x, y: root._y, s: (root._s || 1) * mix(0.32, 1, pr(q, 0, 0.62, E.sp)), o: pr(q, 0, 0.14) });
      rv.forEach((r, i) => { const a = pr(q, 0.32 + i * 0.04, 0.5 + i * 0.04, E.ob); r.style.transform = `scale(${a.toFixed(3)})`; r.style.opacity = cl(a).toFixed(2); });
      const reveal = pr(q, 0.22, 0.95, E.io);
      svg.style.clipPath = `inset(-10% ${((1 - reveal) * 100).toFixed(2)}% -10% -10%)`;
      solid.forEach((path, i) => { const a = pr(q, 0.55 + i * 0.045, 0.95 + i * 0.045, E.io); path.style.strokeDasharray = lens[i]; path.style.strokeDashoffset = (lens[i] * (1 - a)).toFixed(2); });
      dashed.forEach((path) => { path.style.opacity = pr(q, 1.0, 1.25).toFixed(2); });
      marks.forEach((m, i) => { const a = pr(q, 1.1 + i * 0.06, 1.3 + i * 0.06, E.ob); m.style.transformBox = 'fill-box'; m.style.transformOrigin = 'center'; m.style.transform = `scale(${cl(a + 0.0001).toFixed(3)})`; });
      [...nm.children].forEach((c, i) => {
        const a = pr(q, 0.95 + i * 0.16, 1.3 + i * 0.16, E.ob);
        c.style.transform = `translateY(${((1 - a) * -60).toFixed(1)}px) scale(${mix(2.4, 1, a).toFixed(3)})`;
        c.style.opacity = pr(q, 0.95 + i * 0.16, 1.05 + i * 0.16).toFixed(3);
      });
      const e = pr(q, 1.3, 1.75, E.oc);
      en.style.letterSpacing = `${mix(0.95, 0.34, e).toFixed(3)}em`; en.style.textIndent = en.style.letterSpacing; en.style.opacity = e.toFixed(3);
      const r = pr(q, 1.5, 1.95, E.oc);
      ra.style.transform = `scaleX(${r.toFixed(3)})`;
      rl.style.transform = `translateX(${((1 - r) * 60).toFixed(1)}px)`; rr.style.transform = `translateX(${((1 - r) * -60).toFixed(1)}px)`;
      rl.style.opacity = rr.style.opacity = r.toFixed(3);
    }
    return { root, render, at(x, y, s) { root._x = x; root._y = y; root._s = s; } };
  }

  function fakeQr(seed) {
    let h = 0; for (const c of seed) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    const rnd = () => ((h = (h * 1103515245 + 12345) >>> 0) / 4294967296);
    const N = 25; let r = '';
    const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#1E2C40"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" fill="#1E2C40"/>`;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const inF = (x < 8 && y < 8) || (x > N - 9 && y < 8) || (x < 8 && y > N - 9);
      if (!inF && rnd() > 0.5) r += `<rect x="${x}" y="${y}" width="1" height="1" fill="#1E2C40"/>`;
    }
    return `<svg viewBox="0 0 ${N} ${N}" width="300" height="300" shape-rendering="crispEdges">${r}${finder(0, 0)}${finder(N - 7, 0)}${finder(0, N - 7)}</svg>`;
  }

  const scenes = [];
  // 甩鏡轉場（7.6–8.15）：side 0＝出場的場景，1＝進場的場景；速度最快時加動態模糊
  const WHIP = [7.6, 8.15];
  function whip(e, t, side) {
    const p = pr(t, WHIP[0], WHIP[1], E.ioe);
    e.style.transform = `translateX(${((side ? 1920 : 0) - p * 1920).toFixed(1)}px)`;
    const b = Math.sin(Math.PI * cl((t - WHIP[0]) / (WHIP[1] - WHIP[0]))) * 22;
    e.style.filter = b > 0.3 ? `blur(${b.toFixed(1)}px)` : 'none';
  }
  function scene(t0, t1, cls) { const s = el('div', 'scene ' + (cls || '')); const c = el('div', 'cam', s); const sc = { t0, t1, el: s, cam: c, render: null }; scenes.push(sc); return sc; }

  /* ═════════ 1. Logo 開場 0–4.3 ═════════ */
  {
    const S = scene(0, 4.3);
    const rail = el('div', 'a rail', S.cam); rail.style.width = '2300px';
    const tr = el('div', 'a train', S.cam);

      S.el.style.opacity = (pr(t, 52.0, 52.25) * (1 - pr(t, 57.6, 58.0))).toFixed(3);
    };
  }

  function renderAt(t) {
    for (const sc of scenes) {
      const on = t >= sc.t0 && t < sc.t1;
      sc.el.style.display = on ? '' : 'none';
      if (on) sc.render(t);
    }
  }
  window.FILM = { DUR, renderAt };
  // 預覽：?t=12.3 停在某一格；否則用真實時間播放
  const q = new URLSearchParams(location.search);
  function fitPreview() { if (!q.has('render')) { const k = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transformOrigin = '0 0'; stage.style.transform = `scale(${k})`; } }
  addEventListener('resize', fitPreview); fitPreview();
  const ready = Promise.all([document.fonts.load('900 100px "Noto Sans TC"'), document.fonts.load('700 40px "Noto Sans TC"'), ...[...document.images].map((i) => i.decode().catch(() => null))]);
  ready.then(() => {
    window.FILM.ready = true;
    if (q.has('t')) renderAt(+q.get('t'));
    else if (!q.has('render')) { const t0 = performance.now(); (function loop() { renderAt(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); })(); }
  });
})();
