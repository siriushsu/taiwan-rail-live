<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>日夜光影 · 地景預覽</title>
<style>*{box-sizing:border-box}body{margin:0;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);background:#ede8dc;color:#203e49;font-family:system-ui,sans-serif}header{padding:10px 16px;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;border-bottom:1px solid #c3b99f}h1{font-size:17px;margin:0}p{font-size:12px;margin:5px 0 0;color:#706b5b}nav{display:flex;gap:6px;flex-wrap:wrap}nav:last-child{margin-left:auto}button{font:inherit;font-size:13px;color:inherit;border:1px solid #c3b99f;border-radius:9px;background:#fffcf5;padding:10px 12px;min-height:44px;cursor:pointer}button[aria-pressed=true]{background:#274e62;color:white;border-color:#274e62}iframe{display:block;width:100%;height:100%;min-height:0;border:0}button:disabled{opacity:.4}@media(max-width:620px){header{padding:8px 10px;gap:8px}header>div{width:100%}nav:last-child{margin-left:0}button{padding:10px;font-size:12px}}</style>
<header><div><h1>日夜光影 · 地景預覽</h1><p id="status" role="status">正在載入台南地景…</p></div><nav aria-label="預覽地景"><button data-scene="tainan" aria-pressed="true" disabled>台南起伏</button><button data-scene="mountains" aria-pressed="false" disabled>阿里山起伏</button><button data-scene="city" aria-pressed="false" disabled>台北平坦</button></nav><nav aria-label="預覽時段"><button data-hour="6" disabled>晨光 06:00</button><button data-hour="12" aria-pressed="true" disabled>正午 12:00</button><button data-hour="18" disabled>夕色 18:00</button><button data-hour="0" disabled>夜幕 00:00</button></nav></header>
<iframe id="scene" title="軌島日夜光影實際場景" src="./index.html?lang=zh-TW&amp;map=landscape&amp;scene=3d&amp;ground=terrain&amp;at=22.974,120.227&amp;z=13.5&amp;t=12:00&amp;sun=on"></iframe>
<script>
const frame=document.getElementById('scene'),buttons=[...document.querySelectorAll('button')],status=document.getElementById('status');
let place='tainan',hour=12,busy=false;
const views={tainan:{center:[120.227,22.974],zoom:13.5,pitch:75,bearing:0},mountains:{center:[120.731,23.518],zoom:12.5,pitch:75,bearing:75},city:{center:[121.565,25.033],zoom:16.5,pitch:75,bearing:0}};
function showStatus(){status.textContent=({tainan:'台南 · 地形起伏',mountains:'阿里山 · 地形起伏',city:'台北 · 平坦地面'}[place])+' · 本機預覽，尚未上線';}
async function changeScene(next){if(busy)return;busy=true;buttons.forEach(b=>b.disabled=true);status.textContent='正在切換地景…';
try{const w=frame.contentWindow;w.eval('clearFollow();state.playing=false;railIslandIntegration.setGroundMode('+JSON.stringify(next==='city'?'flat':'terrain')+');M.raw.jumpTo('+JSON.stringify(views[next])+');setSimSec('+hour*3600+');sunlight.update(true)');
const start=performance.now();while(next!=='city'&&!w.eval('M.raw.queryTerrainElevation('+JSON.stringify(views[next].center)+')>'+ (next==='mountains'?50:0))){if(performance.now()-start>45000)throw Error('地形載入逾時');await new Promise(r=>setTimeout(r,250));}
place=next;document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===place)));showStatus();
}catch(e){status.textContent='地景尚未載入完成，請再試一次。';}finally{busy=false;buttons.forEach(b=>b.disabled=false);}}
const timer=setInterval(()=>{try{const w=frame.contentWindow;if(!w.eval('typeof state!=="undefined"&&state.ready&&!!window.railIslandSunlight&&!!window.railIslandIntegration?.renderer&&M.raw.queryTerrainElevation([120.227,22.974])>0'))return;clearInterval(timer);
w.eval('state.playing=false;document.getElementById("howtoWrap")?.remove();if(!document.body.classList.contains("fs"))document.getElementById("fsFab").click();M.raw.jumpTo('+JSON.stringify(views.tainan)+');railIslandIntegration.setInspection(false);setSimSec(43200);sunlight.update(true)');showStatus();
buttons.forEach(b=>{b.disabled=false;b.onclick=()=>{if(b.dataset.scene){changeScene(b.dataset.scene);return;}hour=Number(b.dataset.hour);w.eval('state.playing=false;setSimSec('+hour*3600+')');document.querySelectorAll('[data-hour]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));};});
}catch{}},250);
</script></html>
