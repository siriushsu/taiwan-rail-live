<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>軌島｜隧道與列車光影預覽</title><style>
*{box-sizing:border-box}body{height:100dvh;display:flex;flex-direction:column;margin:0;background:#eee6d2;color:#253d59;font:15px system-ui}header{padding:12px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid #c9b98f}strong{margin-right:auto}button{min-height:44px;border:1px solid #b4ac97;border-radius:22px;background:#fffdf4;color:#294c73;padding:8px 16px;font:inherit;cursor:pointer}button[aria-pressed=true]{color:white;background:#294c73}#status{width:100%;font-size:12px;color:#6f766f}iframe{display:block;border:0;width:100%;flex:1;min-height:0}@media(max-width:650px){header{gap:6px;padding:8px}strong{width:100%}button{padding:5px 12px}}
</style><script>try{localStorage.setItem('trainmap-howto-seen','1')}catch{}</script><header><strong>隧道 × 列車光影</strong><button id="day" aria-pressed="false">白天</button><button id="night" aria-pressed="true">夜晚</button><button id="travel">開始進洞</button><button id="reverse">換方向</button><button id="portal">看洞口</button><button id="windows">看車窗</button><span id="status">正在載入林口的雙線橋隧銜接…</span></header><iframe id="map" src="/?g=all&scene=3d&map=landscape&t=21:00&sun=on"></iframe><script type="module">
const frame=document.querySelector('iframe'),status=document.querySelector('#status');let w,ready=false,playing=false,direction=-1,offset=90,last=0;
const wait=()=>new Promise(r=>setTimeout(r,200));
while(!frame.contentWindow?.railIslandIntegration?.renderer||!frame.contentWindow?.railIslandPhysical?.portalPaths)await wait();
w=frame.contentWindow;while(!w.railIslandIntegration.capture().vehicles.some(v=>v.systemId==='thsr_sched'))await wait();w.eval(`state.playing=false;clearFollow();clearFreqFollow();document.querySelector('#howtoGo')?.click();document.body.classList.add('fs');M.resize();`);
const {makePath}=await import('/rail-3d/integration/train-path.js');const state=w.railIslandIntegration.capture(),ways=w.railIslandPhysical.geometry.drawingWays('thsr_sched','#ee7623'),parts=['197206562','922552879','197206565'].map(id=>ways.find(r=>r.routeId===id));let total=0;const chunks=parts.map(r=>{const path=makePath(r.coordinates),start=total;total+=path.length;return{r,start,end:total,path};}),coords=parts.flatMap((r,i)=>r.coordinates.slice(i?1:0)),path=makePath(coords),mouth=chunks[1].start;
const route={...parts[0],id:'portal-preview',routeId:'portal-preview',coordinates:coords,level:s=>{const c=chunks.find(c=>s<=c.end)||chunks.at(-1);return c.r.level(Math.max(0,s-c.start));}},template=state.vehicles.find(v=>v.systemId==='thsr_sched');w.railIslandIntegration.render=()=>{};w.railIslandIntegration.setGroundMode('terrain');
function update(){const s=mouth+offset,q=path.at(s).coordinate,v={...template,id:'preview-train',route,chainageM:s,longitude:q[0],latitude:q[1],railDirection:direction,followed:true};w.railIslandIntegration.renderer.update({...state,routes:parts,vehicles:[v],display:{...state.display,enabled:true,modelMode:'all'},followLock:false,selectedVehicleId:null});}
const map=w.eval('M');
function look(){map.raw.setCenterClampedToGround(true);map.raw.jumpTo({center:[121.41105,25.0054],zoom:19.05,pitch:63,bearing:-38});}
look();ready=true;status.textContent='共用全網洞口模型；此處以高鐵編組沿既有股道展示雙向進出。可直接拖曳地圖換角度。';
for(const [id,sec]of [['day',43200],['night',75600]])document.querySelector('#'+id).onclick=()=>{w.eval('setSimSec('+sec+');state.playing=false;');w.railIslandSunlight.setEnabled(true);w.railIslandSunlight.update(true);document.querySelector('#day').setAttribute('aria-pressed',id==='day');document.querySelector('#night').setAttribute('aria-pressed',id==='night');update();};
document.querySelector('#travel').onclick=()=>{playing=!playing;document.querySelector('#travel').textContent=playing?'暫停':'繼續行駛';};document.querySelector('#reverse').onclick=()=>{direction*=-1;update();};document.querySelector('#portal').onclick=look;
function lookWindows(){update();const lead=w.railIslandIntegration.renderer.stats.poseSamples[0]?.cars[0];if(!lead)return;map.raw.setCenterClampedToGround(false);map.raw.jumpTo({center:lead.coordinate,elevation:lead.height+1.5,zoom:19.2,pitch:68,bearing:10});}
document.querySelector('#windows').onclick=lookWindows;
if(new URLSearchParams(location.search).get('view')==='windows'){while(!w.railIslandIntegration.renderer.stats.poseSamples[0]?.cars.length){update();await wait();}lookWindows();}

function tick(now){if(ready&&now-last>33){if(playing){offset+=direction*Math.min(.1,(now-last)/1000)*12;if(offset>180||offset<-180)direction*=-1;}update();last=now;}requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
